<svg width="100%" viewBox="0 0 680 500" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Admin task flow: moderate, support, settle money</title>
<desc>Admin journey starting at sign-in, splitting into a left moderation pipeline (triage queue, preview content, approve or reject, course published) and a right panel of ongoing operations: manage users, revenue dashboard, process refunds, and payouts and reports.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.t{font-size:14px;font-weight:400}.ts{font-size:12px;font-weight:400}.th{font-size:14px;font-weight:500}
.arr{stroke:#888780;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.leader{stroke:#B4B2A9;stroke-width:1;fill:none;stroke-dasharray:3 3}
.c-teal&gt;rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}
.c-teal .th,.c-teal .t{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-purple&gt;rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7;stroke-width:1}
.c-purple .th,.c-purple .t{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-gray&gt;rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}
.c-gray .th,.c-gray .t{fill:#2C2C2A}.c-gray .ts{fill:#444441}
</style>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6" fill="none" stroke="#888780" stroke-width="1.3"/></marker></defs>

<rect class="c-teal" x="40" y="34" width="14" height="14" rx="3"/>
<text class="ts" x="60" y="45" text-anchor="start" fill="#5F5E5A">Moderation pipeline</text>
<rect class="c-purple" x="250" y="34" width="14" height="14" rx="3"/>
<text class="ts" x="270" y="45" text-anchor="start" fill="#5F5E5A">Ongoing operations</text>
<rect class="c-gray" x="430" y="34" width="14" height="14" rx="3"/>
<text class="ts" x="450" y="45" text-anchor="start" fill="#5F5E5A">branch</text>

<g class="c-gray">
<rect x="190" y="58" width="300" height="48" rx="10"/>
<text class="th" x="340" y="80" text-anchor="middle">Admin sign in</text>
<text class="ts" x="340" y="97" text-anchor="middle">secure, PII gated</text>
</g>
<line class="arr" x1="285" y1="106" x2="210" y2="147"/>
<line class="arr" x1="395" y1="106" x2="500" y2="147"/>

<g class="c-teal">
<rect x="70" y="150" width="270" height="52" rx="10"/>
<text class="th" x="205" y="173" text-anchor="middle">Triage queue</text>
<text class="ts" x="205" y="190" text-anchor="middle">pending, catalog-hidden</text>
</g>
<line class="arr" x1="205" y1="202" x2="205" y2="232"/>

<g class="c-teal">
<rect x="70" y="232" width="270" height="52" rx="10"/>
<text class="th" x="205" y="255" text-anchor="middle">Preview content</text>
<text class="ts" x="205" y="272" text-anchor="middle">audited, no enrollment</text>
</g>
<line class="arr" x1="205" y1="284" x2="205" y2="314"/>

<g class="c-teal">
<rect x="70" y="314" width="270" height="52" rx="10"/>
<text class="th" x="205" y="337" text-anchor="middle">Approve or reject</text>
<text class="ts" x="205" y="354" text-anchor="middle">reject needs a reason</text>
</g>
<line class="arr" x1="205" y1="366" x2="205" y2="396"/>

<g class="c-teal">
<rect x="70" y="396" width="270" height="52" rx="10"/>
<text class="th" x="205" y="419" text-anchor="middle">Course published</text>
<text class="ts" x="205" y="436" text-anchor="middle">visible in catalog</text>
</g>

<g class="c-purple">
<rect x="370" y="150" width="280" height="298" rx="12"/>
<text class="th" x="388" y="177" text-anchor="start">Ongoing operations</text>
<line class="leader" x1="388" y1="192" x2="632" y2="192"/>
<text class="th" x="388" y="216" text-anchor="start">Manage users</text>
<text class="ts" x="388" y="234" text-anchor="start">view, suspend</text>
<line class="leader" x1="388" y1="252" x2="632" y2="252"/>
<text class="th" x="388" y="276" text-anchor="start">Revenue dashboard</text>
<text class="ts" x="388" y="294" text-anchor="start">platform-wide sales</text>
<line class="leader" x1="388" y1="312" x2="632" y2="312"/>
<text class="th" x="388" y="336" text-anchor="start">Process refunds</text>
<text class="ts" x="388" y="354" text-anchor="start">gateway-confirmed; clawback if paid</text>
<line class="leader" x1="388" y1="372" x2="632" y2="372"/>
<text class="th" x="388" y="396" text-anchor="start">Payouts and reports</text>
<text class="ts" x="388" y="414" text-anchor="start">itemized, approve then paid</text>
</g>
</svg>
