  # ---- Computer Science, Major 2024 -------------------------------------
  # Credits are the major sheet's own values. Placement comes from Kuwait
  # University's official Suggested Study Plan for this same 2024 major, which
  # names a year (FRESHMAN—SENIOR / السنة الأولى—الرابعة) and a term (Fall,
  # Spring) for every named course: level 1-4, semester 1=Fall, 2=Spring.
  #
  # The plan writes courses in short form (CS101, MATH102, ENG161, STAT201),
  # which resolve to this university's full codes by prefix — CS=0418,
  # MATH=0410, ENG=9988, STAT=0480 — as corroborated by the major sheet itself.
  # That resolution is a recorded curation step, not a transcription.
