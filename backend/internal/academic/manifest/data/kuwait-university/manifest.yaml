    owning_unit_key: ku-computer-science-dept
    slug: computer-science
    name_ar: علوم الحاسوب
    name_en: Computer Science
    name_ar_source: official
    degree_kind: BSC
    sources: [ku-cs-department, ku-student-manual]

  # A real Kuwait University degree, initiated Summer 2024 and owned by the same
  # Computer Science department as the Computer Science degree. It is the actual
  # academic home of Gradex's "Cybersecurity" teaching area — that area is NOT
  # modelled as an invented Program.
