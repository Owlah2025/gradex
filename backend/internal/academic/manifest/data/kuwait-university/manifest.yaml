curricula:
  - key: ku-cs-2024
    program_key: ku-computer-science
    # Kuwait University's Computer Science department publishes this sheet under
    # the label "2024"; it also publishes an older "2018/2023" sheet, which is
    # deliberately not imported (see the launch scope report).
    version_label: "2024"
    version_label_source: official
    effective_from_year: 2024
    sources: [ku-cs-major-2024, ku-cs-department, ku-cs-suggested-study-plan]

  - key: ku-cybersecurity-current
    program_key: ku-cybersecurity
    # The Cybersecurity major sheet carries no version label. The programme was
    # initiated in Summer 2024, which is recorded as the effective year, but the
    # label itself remains an explicit Gradex placeholder.
    version_label: current
    version_label_source: gradex_translation
    version_label_note: >-
      Kuwait University publishes no plan version label on the Cybersecurity
      major sheet. This label is a Gradex placeholder for the currently
      published requirements and must be replaced when an official plan label
      is observed. It must never be shown to a Student as the university's own
      version name.
    effective_from_year: 2024
    sources: [ku-cybersecurity-major-sheet, ku-cybersecurity-program]

  - key: ku-dsai-current
    program_key: ku-data-science-ai
    # The programme documents are dated (major sheets 12 Nov 2024, 8-semester plan
    # 6 Apr 2025) but Kuwait University prints no plan *version label* on them,
    # unlike the Computer Science "2024" sheet. The launch academic year 2025/2026
    # is recorded as effective_from_year rather than invented as a label.
    version_label: current
    version_label_source: gradex_translation
    version_label_note: >-
      Kuwait University publishes no plan version label on the Data Science and
      Artificial Intelligence major sheets or 8-semester plan; the documents carry
      dates (12 Nov 2024 and 6 Apr 2025) rather than a version name. This label is
      a Gradex placeholder and must never be shown to a Student as the
      university's own version name. Replace it when an official label appears.
    effective_from_year: 2025
    sources: [ku-dsai-program, ku-dsai-major-sheet-en, ku-dsai-8-semester-plan]

  - key: ku-cpe-current
    program_key: ku-computer-engineering
    # The engineering program pages publish current requirements without a plan
    # version label. "current" states exactly that rather than inventing a year.
    # Replace it the moment an official label is observed.
    version_label: current
    version_label_source: gradex_translation
    version_label_note: >-
      Kuwait University does not publish a plan version label on the Computer
      Engineering undergraduate program page. This label is a Gradex placeholder
      for the currently published requirements and must be replaced when an
      official plan label is observed.
    sources: [ku-cpe-undergraduate]

  - key: ku-ee-current
    program_key: ku-electrical-engineering
    version_label: current
    version_label_source: gradex_translation
    version_label_note: >-
      Kuwait University does not publish a plan version label on the Electrical
      Engineering undergraduate program page. This label is a Gradex placeholder
      for the currently published requirements and must be replaced when an
      official plan label is observed.
    sources: [ku-ee-undergraduate]

