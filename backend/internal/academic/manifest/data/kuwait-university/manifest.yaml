  # T2.2, Founder Decision 1. A real Kuwait University degree conferred by the
  # Department of Information Science in the College of Life Sciences — not the
  # College of Science, and not a Gradex "Data Science" label. Its Arabic name is
  # the university's own, taken from the official Arabic major sheet.
  - key: ku-data-science-ai
    owning_unit_key: ku-information-science-dept
    slug: data-science-and-artificial-intelligence
    name_ar: علم البيانات والذكاء الاصطناعي
