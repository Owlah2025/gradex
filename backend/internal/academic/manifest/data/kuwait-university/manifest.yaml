# Kuwait University — Gradex launch catalog.
#
# D-091 §11 makes Kuwait University the only launch-data institution. The schema
# is multi-institution; this manifest is deliberately the only one shipped.
#
# Scope principle (D-091, design report §23): cover the Programs Gradex actually
# serves at launch, with every parent Academic Unit those Programs need. This is
# not a complete Kuwait University catalog and is not meant to become one; the
# model expands incrementally without schema change.
#
# Two curation rules are enforced by validation, not convention:
#   * every factual claim cites a source id defined in sources.yaml;
#   * every Arabic string declares whether Kuwait University publishes that exact
#     wording (`official`) or Gradex supplied it (`gradex_translation`).
#
# Placement (recommended_level / recommended_semester) is populated ONLY where
# Kuwait University itself publishes it. The Computer Science Suggested Study
# Plan places named courses in a year (FRESHMAN—SENIOR / السنة الأولى—الرابعة)
# and a semester (Fall, Spring), so those mappings carry both. Every other
# curriculum leaves them null, because no cited source places its courses.
#
# The plan's recommended year and the Student Manual's credit-derived
# الفرقة الدراسية are different concepts that happen to share a scale: the plan
# recommends when to take a course, the manual measures where a Student stands.
# recommended_level stores the former; Student standing is never derived here.

id: kuwait-university-launch-v1
version: "1.2.0"
description: >-
  Kuwait University launch catalog: College of Science and College of Engineering
  and Petroleum units, three undergraduate Programs, their current academic
  plans, and the shared foundation Subjects those plans require.

institution:
  key: ku
  slug: kuwait-university
  country_code: KW
  name_ar: جامعة الكويت
  name_en: Kuwait University
  name_ar_source: official
  # The Student Manual defines الفرقة الدراسية by credits earned across five
  # bands (<=29, 30-59, 60-89, 90-136, >=137). Five is data, never a constant in
  # application logic.
  max_academic_level: 5
  # No foundation/preparatory stage is claimed. Kuwait University admits into a
  # College and assigns sub-majors through the Deanship; that is an enrollment
  # status question for the Student profile tranche, not a foundation programme.
  # Other Kuwaiti universities do run preparatory programmes, which is exactly
  # why this must not be copied across institutions.
  has_foundation_stage: false
  sources: [ku-colleges-index, ku-student-manual]

