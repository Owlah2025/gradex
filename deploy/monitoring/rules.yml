version: 1
checks:
  - id: api_root
    source: http
    path: /
    expected_status: 200
  - id: api_health
    source: http
    path: /healthz
    expected_status: 200
  - id: api_readiness
    source: http
    path: /readyz
    expected_status: 200
    covers: [postgresql, redis, schema]
  - id: worker_process
    source: host_runtime_report
    expected_status: PASS
    identity: compose_project_and_service_labels
  - id: postgresql_schema
    source: host_runtime_report
    expected_status: PASS
    identity: compose_project_and_service_labels
    expected_schema: selected_backend_image_or_validated_api_container_maximum
  - id: transactional_email_outbox
    source: postgres_transactional_email_deliveries
    terminal_states: [PERMANENT_FAILED, EXHAUSTED]
    stale_due_seconds: 3600
    expired_lease: unhealthy
  - id: disk_capacity
    source: statvfs
    warning_used_percent: 85
    critical_used_percent: 95
    critical_min_free_bytes: 5368709120
  - id: backup_freshness
    source: backup_completed_at
    maximum_age_seconds: 7200
    maximum_future_seconds: 300
log_alerts:
  - id: unexpected_server_error
    event: http_request
    condition: status >= 500
  - id: worker_failure
    event: worker_failure
    condition: operation in [job_process, media_outbox_dispatch, redis_health, queue_runtime]
  # LG-018 monitoring. A transactional message the provider refused outright,
  # or that used its whole retry budget, is a launch-critical journey the
  # recipient never received: verification, password reset, or an invitation.
  # The durable in-app record and the source action both survive, so this is an
  # operator alert rather than an incident in the domain.
  - id: transactional_email_undelivered
    event: transactional_email
    condition: phase in [permanent_failure, exhausted]
delivery:
  destinations:
    - type: webhook
      optional_environment: GRADEX_ALERT_WEBHOOK_URL
      optional_bearer_secret: GRADEX_ALERT_WEBHOOK_TOKEN
      https_required_outside_monitor_test: true
    - type: resend_email
      endpoint: https://api.resend.com/emails
      optional_api_key: GRADEX_ALERT_RESEND_API_KEY
      recipient: GRADEX_ALERT_EMAIL_TO
      sender: [EMAIL_FROM_NAME, EMAIL_FROM_ADDRESS]
