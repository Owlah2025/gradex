# Local Student UI preview stack — DEVELOPMENT ONLY.
#
# This file exists so the Student polish project can keep a real backing stack
# running for interactive visual review. It is deliberately NOT the
# production-like topology:
#
#   - Redis runs plaintext with no password. `compose.production-like.yml` runs
#     it TLS-only with `requirepass`, because that is what production does. Here
#     the API runs with APP_ENV=development, which is the only mode the config
#     loader lets a passwordless Redis through, and nothing in this stack is
#     reachable off loopback.
#   - There is no edge, no Caddy, no TLS, and no built application images. The
#     API, worker and seeder are compiled from the working tree so that a source
#     change is one rebuild away, and the frontend runs `next dev` for HMR.
#   - Every published port is bound to 127.0.0.1 and sits in a dedicated range,
#     so this stack cannot collide with — or be mistaken for — the
#     production-like stack another worktree owns.
#
# Bring it up through `scripts/student-preview.sh`, which pins the Compose
# project name. Running `docker compose` against this file directly will
# otherwise derive a project name from the directory and may attach to
# containers this stack does not own.

name: gradex-student-preview

services:
  postgres:
    image: postgres:16.14-alpine
    environment:
      POSTGRES_USER: gradex
      POSTGRES_PASSWORD: gradex
      # The seeder's safety gate refuses to target this database by name. It
      # exists only so the admin DSN has somewhere to connect while it creates
      # and drops the per-run `gradex_playwright_e2e_*` database beside it.
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - preview-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradex -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.4.9-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: gradexminio
      MINIO_ROOT_PASSWORD: gradexminio
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000"
    ports:
      - "127.0.0.1:59000:9000"
    volumes:
      - preview-media-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 gradexminio gradexminio
        mc mb --ignore-existing local/gradex-test
        mc anonymous set none local/gradex-test
    restart: "no"

volumes:
  preview-postgres-data:
  preview-media-data:
