x-backend-environment: &backend-environment
  APP_ENV: production
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
  CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
  CORS_ALLOW_CREDENTIALS: "true"
  TRUSTED_PROXIES: 172.16.0.0/12
  LOG_LEVEL: info
  READINESS_TIMEOUT: 2s
  SHUTDOWN_TIMEOUT: 20s
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  REDIS_ADDR: redis:6379
  REDIS_USERNAME: ${REDIS_USERNAME:-}
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  REDIS_TLS_ENABLED: "true"
  REDIS_TLS_SERVER_NAME: redis
  REDIS_TLS_CA_CERT_FILE: /run/gradex/redis/ca.crt
  S3_ENDPOINT: http://minio:9000
  S3_PRESIGN_ENDPOINT: https://storage.gradex.localhost:18443
  S3_BUCKET: gradex-private-media
  S3_REGION: us-east-1
  S3_USE_PATH_STYLE: "true"
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
  PLAYBACK_TOKEN_SECRET: ${PLAYBACK_TOKEN_SECRET:?PLAYBACK_TOKEN_SECRET is required}
  SALES_WHATSAPP_NUMBER: ${SALES_WHATSAPP_NUMBER:?SALES_WHATSAPP_NUMBER is required}
  SESSION_CSRF_KEY: ${SESSION_CSRF_KEY:?SESSION_CSRF_KEY is required}
  ANONYMOUS_COOKIE_SIGNING_KEY: ${ANONYMOUS_COOKIE_SIGNING_KEY:?ANONYMOUS_COOKIE_SIGNING_KEY is required}
  ANONYMOUS_CSRF_KEY: ${ANONYMOUS_CSRF_KEY:?ANONYMOUS_CSRF_KEY is required}
  ADMISSION_LIMITER_HMAC_KEY: ${ADMISSION_LIMITER_HMAC_KEY:?ADMISSION_LIMITER_HMAC_KEY is required}
  OUTBOX_PROTECTED_PAYLOAD_KEY_VERSION: production-like-v1
  OUTBOX_PROTECTED_PAYLOAD_KEY: ${OUTBOX_PROTECTED_PAYLOAD_KEY:?OUTBOX_PROTECTED_PAYLOAD_KEY is required}
  EMAIL_ENABLED: "true"
  EMAIL_PROVIDER: resend
  EMAIL_API_KEY: ${EMAIL_API_KEY:?EMAIL_API_KEY is required}
  # The default sender keeps the disposable topology self-contained and unable
  # to send: no provider verifies gradex.localhost, so an unconfigured stack
  # cannot mail anyone. The LG-018 real-inbox acceptance run overrides these
  # three from the ignored environment state with the Gradex verified sending
  # domain, and raises the timeout because that run reaches a real provider
  # over the internet rather than a local stub.
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-no-reply@gradex.localhost}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Gradex production-like}
  EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
  EMAIL_PROVIDER_TIMEOUT: ${EMAIL_PROVIDER_TIMEOUT:-2s}
  # The media-safety operating switch. The API accepts SCANNER,
  # ADMIN_CATALOGUE, or TRUSTED_INSTRUCTOR, and refuses to start on anything
  # else. The default here stays the scanner-gated ADMIN_CATALOGUE fallback so
  # an unconfigured stack cannot accept unscanned Instructor uploads by
  # accident; the D-088 acceptance run sets TRUSTED_INSTRUCTOR explicitly in
  # the ignored environment state.
  MEDIA_OPERATING_MODE: ${MEDIA_OPERATING_MODE:-ADMIN_CATALOGUE}
  STUDENT_REGISTRATION_ENABLED: ${STUDENT_REGISTRATION_ENABLED:-false}
  REGISTRATION_POLICY_SET_ID: ${REGISTRATION_POLICY_SET_ID:-gradex-legal-2026-08-09-v1}
  REGISTRATION_POLICY_APPROVED: ${REGISTRATION_POLICY_APPROVED:-false}
  PASSWORD_SCREEN_MODE: ${PASSWORD_SCREEN_MODE:-unavailable}
  COMPROMISED_PASSWORD_ADAPTER_APPROVED: ${COMPROMISED_PASSWORD_ADAPTER_APPROVED:-false}
  COMPROMISED_PASSWORD_TIMEOUT: 3s
  LOGIN_PASSWORD_VERIFY_CONCURRENCY: ${LOGIN_PASSWORD_VERIFY_CONCURRENCY:-1}
  LOGIN_PASSWORD_VERIFY_QUEUE_CAPACITY: ${LOGIN_PASSWORD_VERIFY_QUEUE_CAPACITY:-500}
  LOGIN_PASSWORD_VERIFY_QUEUE_WAIT: ${LOGIN_PASSWORD_VERIFY_QUEUE_WAIT:-45s}
  LOGIN_REQUEST_TIMEOUT: ${LOGIN_REQUEST_TIMEOUT:-60s}
  LEGAL_IDENTITY_MODE: controlled-staging
  LEGAL_OPERATOR_NAME: Gradex Courses
  LEGAL_REGISTRATION_NUMBER: STAGING-NOT-REGISTERED
  LEGAL_REGISTERED_ADDRESS: STAGING ONLY — LEGAL ENTITY DETAILS PENDING
  PRIVACY_EMAIL: ahmedhazemelmelegy11@gmail.com
  SUPPORT_EMAIL: ahmedhazemelmelegy11@gmail.com
  SECURITY_EMAIL: ahmedhazemelmelegy11@gmail.com
  AUTH_FAKE_MODE: "false"

x-backend-volumes: &backend-volumes
  - ${REDIS_TLS_CA_CERT_FILE_HOST:?REDIS_TLS_CA_CERT_FILE_HOST is required}:/run/gradex/redis/ca.crt:ro

services:
  postgres:
    image: postgres:16.14-alpine
    environment:
      POSTGRES_USER: gradex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: gradex
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradex -d gradex"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  restore-postgres:
    profiles: [restore]
    image: postgres:16.14-alpine
    environment:
      POSTGRES_USER: gradex_restore
      POSTGRES_PASSWORD: ${RESTORE_POSTGRES_PASSWORD:?RESTORE_POSTGRES_PASSWORD is required}
      POSTGRES_DB: gradex_restore
    volumes:
      - restore-data:/var/lib/postgresql/data
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradex_restore -d gradex_restore"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: "no"

  redis:
    image: redis:7.4.9-alpine
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        exec redis-server --appendonly no --save "" --port 0 --tls-port 6379 \
          --tls-cert-file /run/gradex/redis/server.crt \
          --tls-key-file /run/gradex/redis/server.key \
          --tls-ca-cert-file /run/gradex/redis/ca.crt \
          --tls-auth-clients no --requirepass "$${REDIS_PASSWORD}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - ${REDIS_TLS_CA_CERT_FILE_HOST:?REDIS_TLS_CA_CERT_FILE_HOST is required}:/run/gradex/redis/ca.crt:ro
      - ${REDIS_TLS_SERVER_CERT_FILE_HOST:?REDIS_TLS_SERVER_CERT_FILE_HOST is required}:/run/gradex/redis/server.crt:ro
      - ${REDIS_TLS_SERVER_KEY_FILE_HOST:?REDIS_TLS_SERVER_KEY_FILE_HOST is required}:/run/gradex/redis/server.key:ro
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --tls --cacert /run/gradex/redis/ca.crt ping"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  media-proof-redis:
    profiles: [media-proof]
    image: redis:7.4.9-alpine
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        exec redis-server --appendonly no --save "" --port 0 --tls-port 6379 \
          --tls-cert-file /run/gradex/redis/server.crt \
          --tls-key-file /run/gradex/redis/server.key \
          --tls-ca-cert-file /run/gradex/redis/ca.crt \
          --tls-auth-clients no --requirepass "$${REDIS_PASSWORD}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - ${REDIS_TLS_CA_CERT_FILE_HOST:?REDIS_TLS_CA_CERT_FILE_HOST is required}:/run/gradex/redis/ca.crt:ro
      - ${REDIS_TLS_SERVER_CERT_FILE_HOST:?REDIS_TLS_SERVER_CERT_FILE_HOST is required}:/run/gradex/redis/server.crt:ro
      - ${REDIS_TLS_SERVER_KEY_FILE_HOST:?REDIS_TLS_SERVER_KEY_FILE_HOST is required}:/run/gradex/redis/server.key:ro
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --tls --cacert /run/gradex/redis/ca.crt ping"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: "no"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      # Community MinIO supports an exact cluster-wide API origin rather than
      # per-bucket CORS. Objects remain private and still require signatures.
      MINIO_API_CORS_ALLOW_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
    volumes:
      - media-data:/data
    networks: [app, edge]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/gradex-private-media
        mc anonymous set none local/gradex-private-media
        mc version enable local/gradex-private-media
        mc admin user add local "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}" || mc admin user enable local "$${S3_ACCESS_KEY}"
        mc admin policy attach local readwrite --user "$${S3_ACCESS_KEY}"
    networks: [app]
    restart: "no"

  migrate:
    image: ${GRADEX_BACKEND_IMAGE:-gradex-backend:s12-local}
    command: ["gradex-migrate", "up"]
    environment:
      <<: *backend-environment
      SERVICE_ROLE: api
    volumes: *backend-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks: [app]
    restart: "no"

  api:
    image: ${GRADEX_BACKEND_IMAGE:-gradex-backend:s12-local}
    command: ["gradex-api"]
    environment:
      <<: *backend-environment
      SERVICE_ROLE: api
      PORT: 8080
    volumes: *backend-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [app, edge]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  api-restore:
    profiles: [restore]
    image: ${GRADEX_BACKEND_IMAGE:-gradex-backend:s12-local}
    command: ["gradex-api"]
    environment:
      <<: *backend-environment
      SERVICE_ROLE: api
      PORT: 8080
      DATABASE_URL: ${RESTORE_DATABASE_URL:?RESTORE_DATABASE_URL is required}
    volumes: *backend-volumes
    depends_on:
      restore-postgres:
        condition: service_healthy
    networks: [app]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: "no"

  worker:
    image: ${GRADEX_BACKEND_IMAGE:-gradex-backend:s12-local}
    command: ["gradex-worker"]
    environment:
      <<: *backend-environment
      SERVICE_ROLE: worker
    volumes: *backend-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [app, edge]
    restart: unless-stopped

  # Creates the single Administrator the LG-018 Admin journeys need. It is
  # profiled, so no ordinary `up` runs it, and it uses the proof image because
  # the default runtime image deliberately omits the bootstrap binary. The
  # passphrase arrives through the environment, never through a flag.
  #
  # Every bootstrap-only variable below defaults to empty rather than using a
  # `:?` required expression. Compose interpolates the whole model before it
  # filters by profile, so a required expression here would make the ordinary
  # production-like `config`/`up` fail whenever these variables are absent —
  # which is always, since they exist only for this one acceptance run.
  # Nothing is weakened by defaulting them: gradex-bootstrap-admin refuses an
  # empty BOOTSTRAP_ADMIN_PASSWORD by name, and identity.Bootstrap rejects an
  # empty operation ID and email, so a missing value still fails the command
  # loudly and is enforced by tested Go rather than by string interpolation.
  bootstrap-admin:
    profiles: [bootstrap]
    image: ${GRADEX_PROOF_IMAGE:-gradex-backend-proof:s12-local}
    entrypoint: ["gradex-bootstrap-admin"]
    command:
      - "-email"
      - "${BOOTSTRAP_ADMIN_EMAIL:-}"
      - "-display-name"
      - "${BOOTSTRAP_ADMIN_DISPLAY_NAME:-Platform Administrator}"
      - "-operation-id"
      - "${BOOTSTRAP_ADMIN_OPERATION_ID:-}"
      - "-principal"
      - "${BOOTSTRAP_ADMIN_PRINCIPAL:-founder@local}"
      - "-confirm-production"
    environment:
      <<: *backend-environment
      SERVICE_ROLE: api
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes: *backend-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [app, edge]
    restart: "no"

  media-proof-tool:
    profiles: [media-proof]
    image: ${GRADEX_PROOF_IMAGE:-gradex-backend-proof:s12-local}
    environment:
      <<: *backend-environment
      SERVICE_ROLE: api
      GRADEX_E2E_ADMIN_DB_URL: postgres://gradex:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/postgres?sslmode=disable
      GRADEX_E2E_TARGET_DB_NAME: gradex_playwright_e2e_s12media01
      GRADEX_E2E_TARGET_DB_URL: ${MEDIA_PROOF_DATABASE_URL:?MEDIA_PROOF_DATABASE_URL is required}
      GRADEX_E2E_ALLOW_DATABASE_RESET: "1"
      REDIS_ADDR: media-proof-redis:6379
      REDIS_TLS_SERVER_NAME: media-proof-redis
    volumes: *backend-volumes
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app]
    restart: "no"

  api-media-proof:
    profiles: [media-proof]
    image: ${GRADEX_BACKEND_IMAGE:-gradex-backend:s12-local}
    command: ["gradex-api"]
    environment:
      <<: *backend-environment
      SERVICE_ROLE: api
      PORT: 8080
      DATABASE_URL: ${MEDIA_PROOF_DATABASE_URL:?MEDIA_PROOF_DATABASE_URL is required}
      REDIS_ADDR: media-proof-redis:6379
      REDIS_TLS_SERVER_NAME: media-proof-redis
    volumes: *backend-volumes
    depends_on:
      media-proof-redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks: [app]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: "no"

  worker-media-proof:
    profiles: [media-proof]
    image: ${GRADEX_BACKEND_IMAGE:-gradex-backend:s12-local}
    command: ["gradex-worker"]
    environment:
      <<: *backend-environment
      SERVICE_ROLE: worker
      DATABASE_URL: ${MEDIA_PROOF_DATABASE_URL:?MEDIA_PROOF_DATABASE_URL is required}
      REDIS_ADDR: media-proof-redis:6379
      REDIS_TLS_SERVER_NAME: media-proof-redis
    volumes: *backend-volumes
    depends_on:
      media-proof-redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks: [app]
    restart: "no"

  frontend:
    image: ${GRADEX_FRONTEND_IMAGE:-gradex-frontend:s12-local}
    environment:
      GRADEX_API_ORIGIN: http://api:8080
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      LEGAL_IDENTITY_MODE: controlled-staging
      LEGAL_OPERATOR_NAME: Gradex Courses
      LEGAL_REGISTRATION_NUMBER: STAGING-NOT-REGISTERED
      LEGAL_REGISTERED_ADDRESS: STAGING ONLY — LEGAL ENTITY DETAILS PENDING
      PRIVACY_EMAIL: ahmedhazemelmelegy11@gmail.com
      SUPPORT_EMAIL: ahmedhazemelmelegy11@gmail.com
      SECURITY_EMAIL: ahmedhazemelmelegy11@gmail.com
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    networks: [app, edge]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  edge:
    image: ${GRADEX_EDGE_IMAGE:-gradex-edge:s12-local}
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "127.0.0.1:18081:80"
      - "127.0.0.1:18443:18443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    restart: unless-stopped

networks:
  app:
    internal: true
  edge: {}

volumes:
  postgres-data:
  restore-data:
  media-data:
  caddy-data:
  caddy-config:
