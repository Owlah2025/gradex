name: CI

# Every guarantee the delivery foundation claims must hold on a clean machine,
# not only on the developer's workstation. Jobs are separated so a failure
# names its own area rather than "CI is red".
on:
  push:
    branches: ["**"]
  pull_request:

# A superseded run on the same ref is wasted capacity and a misleading signal.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. No job here needs to write to the repository, and
# nothing in CI requires a Tap, email, CDN, or production credential — provider
# adapters are exercised against fixtures, never live services.
permissions:
  contents: read

env:
  # Pinned to the toolchain backend/go.mod declares, so CI cannot silently
  # drift onto a different compiler than the one the code is written against.
  GO_VERSION_FILE: backend/go.mod
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: backend/go.sum

      - name: Verify formatting
        working-directory: backend
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Vet
        working-directory: backend
        # The integration variant is vetted too: a build-tagged file that no
        # longer compiles is invisible to a plain `go vet` until someone runs
        # the integration suite.
        run: |
          go vet ./...
          go vet -tags=integration ./...

      - name: Test
        working-directory: backend
        run: go test -race ./...

      - name: Confirm a clean worktree
        # A build or test that writes into the tree makes later runs depend on
        # earlier ones.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The build left changes in the worktree:" >&2
            git status --porcelain >&2
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install from lockfile
        working-directory: frontend
        # `npm ci` installs exactly what the lockfile pins and fails if
        # package.json and the lockfile disagree. `npm install` would resolve
        # fresh versions and rewrite the lockfile, so CI would stop testing the
        # dependency set that ships.
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      # Compiles the pure-TS identity logic with the TypeScript already in
      # devDependencies and runs it under node:test. No test framework is
      # added, so this stays inside the slice's no-new-dependency gate.
      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Postgres only. Redis is not started here: nothing in this job needs it,
    # and an unused service is a slower job and a broader failure surface.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gradex
          POSTGRES_PASSWORD: gradex
          POSTGRES_DB: gradex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gradex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Non-secret settings for a throwaway database. Nothing here is a real
      # credential, and no production secret is available to this job.
      APP_ENV: development
      DATABASE_URL: postgres://gradex:gradex@localhost:5432/gradex?sslmode=disable
      REDIS_ADDR: localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: gradex-ci
      S3_ACCESS_KEY: ci-access-key
      S3_SECRET_KEY: ci-secret-key
      PLAYBACK_TOKEN_SECRET: ci-playback-token-secret-not-a-real-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: backend/go.sum

      - name: Migrate up, up again, down, up
        working-directory: backend
        # No globally installed binary: this is the same command a developer
        # and a release step run.
        run: |
          go run ./cmd/migrate version
          go run ./cmd/migrate up
          go run ./cmd/migrate up      # a release step may run more than once
          go run ./cmd/migrate down 1  # reverts only the newest migration
          go run ./cmd/migrate up

      - name: Verify schema version and expected objects
        working-directory: backend
        run: |
          # The expected version is read from the build under test rather than
          # written here. A literal kept in step with db.MaxSchemaVersion by
          # comment alone already drifted once: migration 0006 raised the
          # constant, this assertion still said 5, and the job failed on an
          # otherwise sound slice. There is now one authority for the number.
          expected="$(go run ./cmd/migrate max-version)"
          case "$expected" in
            ''|*[!0-9]*)
              echo "migrate max-version returned a non-numeric value: '$expected'" >&2
              exit 1
              ;;
          esac
          echo "asserting post-migration schema version $expected"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v expected="$expected" <<'SQL'
          -- psql does not substitute :variables inside $$-quoted blocks, so the
          -- expected version is stored in a session setting first, outside the
          -- dollar quotes, and read back inside.
          SELECT set_config('gradex.expected_schema_version', :'expected', false);

          DO $$
          DECLARE
            v bigint;
            d boolean;
            missing text;
            expected bigint := current_setting('gradex.expected_schema_version')::bigint;
          BEGIN
            SELECT version, dirty INTO v, d FROM schema_migrations ORDER BY version DESC LIMIT 1;
            IF v IS DISTINCT FROM expected THEN
              RAISE EXCEPTION 'schema version is %, expected %', v, expected;
            END IF;
            IF d THEN
              RAISE EXCEPTION 'schema is dirty after a successful migration';
            END IF;

            SELECT string_agg(t, ', ') INTO missing
            FROM unnest(ARRAY[
              'courses','sections','lessons','videos','progress','fake_entitlements',
              'accounts','password_credentials','bootstrap_operations','audit_events',
              'sessions','session_credentials','policy_acceptances',
              'identity_action_secrets','identity_security_events',
              'outbox_events','outbox_protected_payloads'
            ]) AS t
            WHERE to_regclass('public.' || t) IS NULL;
            IF missing IS NOT NULL THEN
              RAISE EXCEPTION 'missing tables after migration: %', missing;
            END IF;
          END $$;
          SQL

      - name: Refuse production down migrations
        working-directory: backend
        env:
          APP_ENV: production
          PUBLIC_ORIGIN: https://ci.gradex.invalid
          CORS_ALLOWED_ORIGINS: https://ci.gradex.invalid
          AUTH_FAKE_MODE: "false"
          PLAYBACK_TOKEN_SECRET: ci-production-shaped-token-not-a-real-key
        run: |
          if go run ./cmd/migrate down 1; then
            echo "A production down migration was permitted." >&2
            exit 1
          fi
          echo "Production down migration refused, as required."

      - name: Redact secrets in migration failure output
        working-directory: backend
        env:
          DATABASE_URL: postgres://gradex:CI_CANARY_PASSWORD@localhost:5999/nope?sslmode=disable
        run: |
          output="$(go run ./cmd/migrate up 2>&1 || true)"
          echo "$output"
          if printf '%s' "$output" | grep -q 'CI_CANARY_PASSWORD'; then
            echo "The database password reached migration output." >&2
            exit 1
          fi
          echo "Password redacted from failure output, as required."

      - name: Schema integration tests
        working-directory: backend
        # Covers dirty-state detection and unsupported-version detection
        # against a real database.
        run: go test -tags=integration -run 'TestMigrateUpDownUp|TestDirtySchema|TestUnsupportedSchema' ./internal/db/

  admission-integration:
    name: Admission Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gradex
          POSTGRES_PASSWORD: gradex
          POSTGRES_DB: gradex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gradex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: backend/go.sum

      - name: Admission migration and transaction evidence
        working-directory: backend
        run: |
          go test -tags=integration ./internal/db
          go test -tags=integration ./internal/identity ./internal/outbox ./internal/httpapi ./internal/catalogpublic ./internal/ratelimit

  guards:
    name: Guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Documentation guard
        run: ./scripts/docs-guard.sh

      - name: Secret exposure guard
        run: ./scripts/expose-guard.sh

  # ---------------------------------------------------------------------------
  # S5 T075 — rendered RTL/LTR viewport evidence (SC-010)
  #
  # WHY THIS JOB EXISTS
  #   SC-010 requires rendered evidence for every S5 screen in both directions at
  #   all four viewports, *retained* — the S2 T066 standard, which STATUS.md
  #   records as "the retained HTML report is the configured CI artifact". Nothing
  #   configured it: the HTML report and the 32 PNGs were written to paths that
  #   .gitignore excludes or that a machine deletes, so the evidence existed only
  #   until the next cleanup. This job is that configuration. Durability comes
  #   from the artifact upload, not from any directory on the runner.
  #
  # WHY NO MinIO
  #   The E2E stack does not need it. global-setup points S3_ENDPOINT at the
  #   run-owned local media fixture server it starts itself, so object storage is
  #   already local to the run. An unused service container is a slower job and a
  #   broader failure surface.
  #
  # WHY POSTGRES AND REDIS ON localhost
  #   The shared E2E setup resolves both at localhost, and the run gets its own
  #   throwaway database inside the instance plus a per-run limiter key namespace
  #   in Redis. Neither is a shared development or production store.
  s5-rendered-evidence:
    name: S5 T075 Rendered Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gradex
          POSTGRES_PASSWORD: gradex
          POSTGRES_DB: gradex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gradex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Runner-temporary paths are resolved HERE, not in a job-level `env:` block.
      # The `runner` context does not exist at job level — only from step level —
      # and using it there is a workflow-validation error that fails the whole
      # file before any job starts, which is exactly how run 31031033462 produced
      # zero jobs. `$RUNNER_TEMP` is an ordinary environment variable available to
      # the shell, and `$GITHUB_ENV` publishes the values to every later step, so
      # downstream `${{ env.* }}` references stay legal and shell consumers see
      # them too.
      #
      # This step precedes every consumer: npm, Playwright, the manifest, the
      # audit, and both uploads. Nothing secret is written to `$GITHUB_ENV` —
      # these are directory paths.
      - name: Resolve evidence paths and prepare directories
        run: |
          evidence_dir="$RUNNER_TEMP/gradex-s5-t075-evidence"
          tmp_dir="$RUNNER_TEMP/gradex-s5-e2e"
          {
            echo "T075_EVIDENCE_DIR=$evidence_dir"
            echo "GRADEX_E2E_TMP_DIR=$tmp_dir"
          } >> "$GITHUB_ENV"
          rm -rf "$evidence_dir"
          mkdir -p "$evidence_dir/rendered" "$evidence_dir/playwright-report" "$tmp_dir"

      - name: Install from lockfile
        working-directory: frontend
        run: npm ci

      # The browser build is resolved from the lockfile-pinned @playwright/test,
      # so the runner cannot drift onto a different Chromium than the version the
      # evidence claims. Only Chromium is installed: the matrix is Chromium-only.
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # The HLS fixture is generated, not downloaded. `e2e-media-server.ts` calls
      # `execFileSync("ffmpeg", …)` by bare name, so it needs a real ffmpeg on
      # PATH — Playwright's cached ffmpeg build is not installed by
      # `playwright install --with-deps chromium` and is not exposed as `ffmpeg`
      # anyway. GitHub's ubuntu-latest image no longer ships ffmpeg, which is why
      # run 31058573516 died in global setup with `spawnSync ffmpeg ENOENT`
      # before a single T075 test ran. It never reproduced locally because this
      # workstation has /usr/bin/ffmpeg.
      #
      # The fixture encodes H.264 video and AAC audio from lavfi sources, so a
      # full distribution build is required, not a minimal one. Ubuntu's package
      # provides libx264 and the native AAC encoder, and it also installs
      # ffprobe, which covers FFPROBE_BINARY_PATH should anything reach for it.
      # No third-party binary is downloaded and no public media URL is used.
      - name: Install ffmpeg for the generated HLS fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      # global-setup compiles the API and seeder to external output paths, creates
      # and seeds an isolated per-run database, starts the run-owned media server
      # and the Go API, and probes readiness; global-teardown stops all of it and
      # drops the database even when the run fails. Only the T075 spec runs.
      #
      # continue-on-error keeps the upload and audit steps reachable on failure;
      # the job is failed explicitly at the end, so a red run is still red.
      # `continue-on-error` keeps the audit and upload steps reachable on failure, but it also
      # rewrites this step's *conclusion* to success in the API while `steps.t075.outcome` holds the
      # truth — which made hosted run 31035395606 look like it passed a step it had failed. The raw
      # output is captured so a failure is classifiable without admin log access, and `pipefail`
      # keeps `tee` from masking the real exit status.
      #
      # The raw log stays in the runner temp and is NEVER uploaded: on failure Playwright prints the
      # received value of the failing assertion, and the leak detector compares against the whole
      # rendered page, which legitimately carries the encrypted report context. Only the sanitized
      # copy enters the artifact.
      - name: Run T075 rendered-evidence suite
        id: t075
        continue-on-error: true
        working-directory: frontend
        shell: bash
        env:
          GRADEX_T075_EVIDENCE_DIR: ${{ env.T075_EVIDENCE_DIR }}/rendered
          GRADEX_PLAYWRIGHT_HTML_DIR: ${{ env.T075_EVIDENCE_DIR }}/playwright-report
        run: |
          set -o pipefail
          npx playwright test e2e/s5-viewport-evidence.spec.ts 2>&1 | tee "$RUNNER_TEMP/t075-playwright-raw.log"

      # Sanitized before anything is published: opaque runs long enough to be a token are replaced
      # by their length and every line is capped. Runs on success and failure so the artifact always
      # explains itself.
      - name: Sanitize evidence log
        if: always()
        working-directory: frontend
        run: node scripts/t075-evidence-manifest.mjs sanitize-log "$RUNNER_TEMP/t075-playwright-raw.log" "$T075_EVIDENCE_DIR"

      # Surface the failing tests as annotations, from the sanitized digest only.
      - name: Annotate failing tests
        if: steps.t075.outcome != 'success'
        run: |
          digest="$T075_EVIDENCE_DIR/logs/t075-failure-digest.txt"
          echo "::error title=T075 rendered evidence::the S5 rendered-evidence matrix failed; see the FAILED artifact's logs/ directory"
          if [ -f "$digest" ]; then
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::${line}"
            done < "$digest"
          fi

      - name: Generate evidence manifest
        if: steps.t075.outcome == 'success'
        working-directory: frontend
        run: node scripts/t075-evidence-manifest.mjs generate "$T075_EVIDENCE_DIR"

      - name: Verify 32-cell integrity
        if: steps.t075.outcome == 'success'
        working-directory: frontend
        run: node scripts/t075-evidence-manifest.mjs verify "$T075_EVIDENCE_DIR"

      # Runs on success and on failure, and always before any upload: an artifact
      # is never published until it has been proved to carry no credential-shaped
      # value. Trace archives are deliberately not in this directory — they are
      # compressed, so a byte scan cannot audit them, and an unauditable archive
      # is not something to publish. Traces remain failure-only on the runner.
      - name: Sensitive-data audit
        if: always()
        working-directory: frontend
        run: node scripts/t075-evidence-manifest.mjs audit "$T075_EVIDENCE_DIR"

      - name: Upload retained evidence
        if: steps.t075.outcome == 'success'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: gradex-s5-t075-rendered-${{ github.sha }}
          path: ${{ env.T075_EVIDENCE_DIR }}
          if-no-files-found: error

      # A distinct name, so a diagnostic upload can never be mistaken for the
      # retained evidence of a passing run.
      - name: Upload failure diagnostics
        if: steps.t075.outcome != 'success'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: gradex-s5-t075-rendered-FAILED-${{ github.sha }}
          path: ${{ env.T075_EVIDENCE_DIR }}
          if-no-files-found: warn

      - name: Job summary
        if: always()
        run: |
          MANIFEST="$T075_EVIDENCE_DIR/manifest.json"
          PNGS=$(find "$T075_EVIDENCE_DIR/rendered" -name '*.png' 2>/dev/null | wc -l | tr -d ' ')
          {
            echo "## S5 T075 — rendered RTL/LTR viewport evidence (SC-010)"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Spec | \`frontend/e2e/s5-viewport-evidence.spec.ts\` |"
            echo "| Test result | ${{ steps.t075.outcome }} |"
            echo "| Rendered cells | ${PNGS}/32 |"
            if [ "${{ steps.t075.outcome }}" = "success" ]; then
              echo "| Artifact | \`gradex-s5-t075-rendered-${{ github.sha }}\` |"
            else
              echo "| Artifact | \`gradex-s5-t075-rendered-FAILED-${{ github.sha }}\` (diagnostic only) |"
            fi
            echo "| Test step outcome (pre-continue-on-error) | ${{ steps.t075.outcome }} |"
            echo "| Sanitized log in artifact | \`logs/t075-playwright.log\` |"
            echo "| HTML report in artifact | \`playwright-report/index.html\` |"
            echo "| Manifest in artifact | \`manifest.json\` |"
            if [ -f "$MANIFEST" ]; then
              echo "| Sensitive-data audit | $(node -e 'const m=require(process.argv[1]);console.log(m.sensitive_data_audit?.status??"not-run")' "$MANIFEST") |"
            else
              echo "| Sensitive-data audit | manifest absent |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if T075 did not pass
        if: steps.t075.outcome != 'success'
        run: |
          echo "T075 rendered-evidence suite failed; see the diagnostic artifact." >&2
          exit 1
